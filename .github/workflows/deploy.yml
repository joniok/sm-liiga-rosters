name: Build & Deploy to GitHub Pages

on:
  # Rebuild on every push to main so fixes (e.g. templates) reach Pages without
  # waiting for the next scheduled run.
  push:
    branches: [main]

  # GitHub Actions cron is UTC. Approx. Finnish time (EET, UTC+2):
  #   05:00 UTC → 07:00   | 11:30 UTC → 13:30   | 21:00 UTC → 23:00
  # EEST (summer): add +1 h to local wall clock vs these UTC times.
  schedule:
    - cron: "0 5 * * *"
    - cron: "30 11 * * *"
    - cron: "0 21 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
